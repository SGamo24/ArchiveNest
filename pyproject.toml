[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-nest"
version = "0.1.0"
description = "Copy-only preparation and verification of long-term photo and video archives"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ArchiveNest contributors" }]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
build = ["PyInstaller>=6.10,<7"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "pytest-mock>=3.14,<4",
  "pytest-socket>=0.7,<1",
  "tqdm==4.70.0",
]

[project.scripts]
archivenest = "archive_nest.cli:main"
archivenest-gui = "archive_nest.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["archive_nest*"]

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]
